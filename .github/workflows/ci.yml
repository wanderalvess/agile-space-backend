name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: espacoagil
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d espacoagil"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # E2EAgileCycleTest e outros testes @SpringBootTest precisam de um Postgres real
      # de verdade (não só refletido em getBean) — sem isso, falham em cascata (ver
      # memória "agile-space-deploy-readiness" sobre esse comportamento observado localmente).
      - name: Run test suite
        run: mvn -B clean test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/espacoagil
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
