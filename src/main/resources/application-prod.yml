spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration
    # baseline-on-migrate/out-of-order herdados de application.yml (V1_1__baseline_schema.sql
    # cobre o cenário de banco com schema pré-existente sem histórico Flyway, sem precisar de
    # baseline manual).

server:
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

app:
  security:
    encryption-key: ${APP_ENCRYPTION_SECRET}
