spring:
  application:
    name: agile-space-backend
  servlet:
    multipart:
      # Anexos dos cards da Review (PNG/JPEG/PDF, até 10 MB cada). O padrão do Spring é 1 MB.
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/espacoagil}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    # V1_1__baseline_schema.sql foi inserida depois de V1-V7 já existirem em produção/dev.
    # out-of-order permite que bancos que já rodaram até V7 apliquem essa migration "atrasada"
    # (idempotente, só cria o que ainda não existe) sem travar em erro de ordem do Flyway.
    out-of-order: true
  ai:
    mcp:
      server:
        # Servidor MCP embutido, protegido por ApiKeyAuthenticationFilter (mesma
        # chave X-Api-Key usada em /api/v1/**). Endpoints fixados sob /mcp/**,
        # dentro do path que o filtro já intercepta (ver shouldNotFilter lá).
        name: agile-space-mcp-server
        version: 1.0.0
        type: SYNC
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message
        instructions: >
          Servidor MCP do Espaço Ágil: ferramentas de leitura/importação da base
          de conhecimento, leitura de dados de squad e criação de sessão de poker.
          Requer header X-Api-Key igual ao usado em /api/v1/**.

server:
  port: ${PORT:8002}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

app:
  uploads:
    # Onde ficam os anexos dos cards. No Docker é o volume agile-space-uploads (/data/uploads).
    dir: ${UPLOADS_DIR:./data/uploads}
  security:
    # Obrigatório em produção. Defina a variável de ambiente APP_ENCRYPTION_SECRET.
    # Em dev local, pode usar um valor padrão. Em produção, nunca use fallback hardcoded.
    # Gerar com: openssl rand -base64 32
    encryption-key: ${APP_ENCRYPTION_SECRET:AgileSpaceDevMasterKey2026LocalOnly#AES}
    # Segredo HMAC que assina os JWT de sessão. Default só pra dev local; o profile prod não tem
    # default e o ProductionSecretsValidator recusa subir com este valor.
    # Gerar com: openssl rand -base64 48
    jwt-secret: ${APP_JWT_SECRET:AgileSpaceDevJwtSecret2026LocalOnly#NeverUseInProduction}
    # Chave de acesso admin para o endpoint GET /api/users (listagem de usuários).
    # Defina APP_ADMIN_KEY no ambiente (ou deixe vazio pra desabilitar endpoint).
    admin-key: ${APP_ADMIN_KEY:}
    # Vazio = autocadastro (POST /api/auth/register) liberado pra qualquer e-mail — é o
    # default de dev/teste (fixtures usam @empresa.com.br). Produção restringe via
    # application-prod.yml.
    allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:}
    # Proxies reversos confiáveis (IPs/CIDRs separados por vírgula) cujo X-Forwarded-For o RateLimitFilter
    # pode ler para achar o IP real do cliente. Vazio (default) = o cabeçalho é IGNORADO e o limite vale por
    # endereço da conexão, então um cliente não escapa do limite forjando XFF. Atrás do Caddy do docker-compose
    # (profile "proxy") use TRUSTED_PROXIES=172.16.0.0/12 (faixa padrão das redes Docker); sem isso todos
    # compartilham o balde do proxy. Ver DEPLOYMENT.md.
    trusted-proxies: ${TRUSTED_PROXIES:}
  brainstorming:
    # Segundos que o facilitador precisa estar offline (sem WebSocket na sala) para outro participante assumir a facilitação.
    # Criador do mural e ADMIN assumem sempre. Ver docs/ceremony-brainstorming-api.md.
    facilitator-offline-seconds: ${BRAINSTORMING_FACILITATOR_OFFLINE_SECONDS:60}
  cors:
    # Lista separada por vírgula das origens que podem chamar a API com credenciais
    # (ver WebCorsConfig/WebSocketConfig). Default cobre só o frontend em dev local
    # (next dev -p 9002); em produção defina ALLOWED_ORIGINS com o(s) domínio(s) público(s).
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:9002}
  membership:
    # Migração do vínculo Pessoa x Squad x Papel (docs/vinculo-auditoria-e-plano.md, Etapa 1; contrato em docs/membership-api.md).
    #   legacy = sessão (accessibleProjects/activeProject*) como antes, sem o modelo novo.
    #   shadow = a resposta continua a do legado; o modelo novo roda em paralelo e as divergências vão para o log
    #            (membership_divergence) e para o contador membership.divergence. Padrão.
    #   new    = a resposta vem do modelo novo (squad ativa validada contra os vínculos).
    # Valor desconhecido cai em legacy. Reverter = APP_MEMBERSHIP_MODE=legacy e reiniciar; não há migração de banco.
    mode: ${APP_MEMBERSHIP_MODE:shadow}
    # TTL do cache de vínculos por usuário (segundos; 0 desliga). Toda gravação de pmr/projeto o invalida.
    cache-ttl-seconds: ${APP_MEMBERSHIP_CACHE_TTL_SECONDS:60}
    # AUTORIZAÇÃO por squad (docs/vinculo-auditoria-e-plano.md, Etapa 2). ALTO RISCO: quem hoje acessa só por roster
    # (squad_members), por users.squad_id solto ou por cargo (jobTitle) perde o acesso quando virar new.
    #   legacy = decisão exatamente como antes (padrão; valor desconhecido também cai aqui, nunca em new).
    #   shadow = a decisão continua a do legado; a regra nova roda em paralelo e cada divergência vira o log
    #            authz_divergence e o contador authz.divergence{check,direction}.
    #   new    = decide a regra nova: ADMIN e vínculos de project_member_roles (LEAD só com lead-level=legacy).
    # Antes de virar new: GET /api/admin/membership/authz-diff e a categoria WOULD_LOSE_ACCESS de /report. Reverter =
    # APP_MEMBERSHIP_AUTHZ=legacy e reiniciar; não há migração de banco.
    authz: ${APP_MEMBERSHIP_AUTHZ:legacy}
    # O que o nível de conta LEAD ainda concede (Etapa 4; docs/membership-api.md). Níveis de conta viram ADMIN|MEMBER: quem
    # lidera uma squad tem um VÍNCULO de liderança (project_member_roles.is_leadership).
    #   off    = LEAD não concede NADA (tratado como MEMBER em toda decisão de acesso). Padrão (instalação nova).
    #   legacy = comportamento de antes (LEAD acessa/gerencia todas as squads, convida, facilita Poker, chaves de API).
    # Valor desconhecido cai em legacy (errar a digitação nunca REMOVE acesso); para desligar escreva off. Reverter =
    # APP_MEMBERSHIP_LEAD_LEVEL=legacy e reiniciar (contas já rebaixadas: POST /api/admin/membership/lead-restore).
    lead-level: ${APP_MEMBERSHIP_LEAD_LEVEL:off}
    # Repetição do MESMO log authz_divergence (conta, ponto, squad, sentido): no máximo a cada N segundos (0 = toda vez).
    # O contador authz.divergence conta todas.
    authz-log-dedupe-seconds: ${APP_MEMBERSHIP_AUTHZ_LOG_DEDUPE_SECONDS:60}
    # Bootstrap de squad vazia (SquadBootstrapService). Só importa com authz=new:
    #   off = padrão (valor desconhecido também): ninguém ganha acesso a squad vazia por aqui (403 para não-ADMIN).
    #   on  = a primeira pessoa sem vínculo que escreve numa squad inexistente vira Agile Master dela (cria projeto + pmr).
    #         ATENÇÃO: qualquer conta sem vínculo pode inventar uma chave de squad e ganhar poder de gerir equipes.
    # Em authz=legacy|shadow o bootstrap segue como sempre (grava users.squad_id), independente desta chave.
    bootstrap: ${APP_MEMBERSHIP_BOOTSTRAP:off}
  showcase:
    # Review (docs/ceremony-review-api.md). Trava de decisão: só ADMIN, liderança da squad (vínculo) e PO/SME da squad mudam o
    # veredito e o feedback de um card; os demais recebem 403.
    #   enforce = trava ligada. Padrão (qualquer valor diferente de off também).
    #   off     = trava desligada (comportamento anterior). Reverter a trava sem redeploy = APP_SHOWCASE_DECISION_LOCK=off e reiniciar.
    decision-lock: ${APP_SHOWCASE_DECISION_LOCK:enforce}
    # Minutos sem renovar até o apresentador (estado em memória) deixar de valer.
    presenter-ttl-minutes: ${APP_SHOWCASE_PRESENTER_TTL_MINUTES:240}
  link-requests:
    # Pedido de vínculo (docs/link-requests-squad-api.md, Etapa 3 do vínculo): AM/SM/PO/People Lead da squad aprovam
    # contribuidores e People/Tribe Lead (ou ADMIN) aprovam liderança, pelas rotas /api/squads/{id}/link-requests*.
    #   on  = rotas por squad ativas e notificação aos aprovadores da squad (ADMIN só como fallback). Padrão.
    #   off = as rotas por squad respondem 404; só ADMIN aprova (/api/admin/link-requests) e só ADMIN é notificado.
    # Valor desconhecido cai em off. Reverter = APP_LINK_REQUESTS_SQUAD_APPROVAL=off e reiniciar; sem migração de banco.
    squad-approval: ${APP_LINK_REQUESTS_SQUAD_APPROVAL:on}
  squad:
    scheduled-sync:
      # Desligado por padrão: ligar isso é uma mudança de comportamento real (um processo
      # passa a agir com o PAT salvo de um usuário sem ele clicar em nada, e pode bater no
      # rate limit do Jira se muitos squads estiverem configurados). Squads sem
      # syncOwnerUserId configurado continuam manuais mesmo com a flag ligada.
      enabled: ${SQUAD_SCHEDULED_SYNC_ENABLED:false}
      fixed-delay-ms: ${SQUAD_SCHEDULED_SYNC_FIXED_DELAY_MS:900000}


