spring:
  application:
    name: agile-space-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/espacoagil}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8002}
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

app:
  security:
    # Em produção, defina a variável de ambiente APP_ENCRYPTION_SECRET.
    # O valor padrão abaixo é usado apenas como fallback de desenvolvimento local.
    encryption-key: ${APP_ENCRYPTION_SECRET:AgileSpaceDevMasterKey2026LocalOnly#AES}
    # Chave de acesso admin para o endpoint GET /api/users (listagem de usuários).
    # Defina APP_ADMIN_KEY no ambiente. Sem ela, o endpoint retorna 403.
    admin-key: ${APP_ADMIN_KEY:}


