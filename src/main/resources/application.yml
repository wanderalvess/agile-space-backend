spring:
  application:
    name: agile-space-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/espacoagil}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${PORT:8002}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

app:
  security:
    encryption-key: ${APP_ENCRYPTION_SECRET:AgileSpaceSecureMasterKey2026Default#AES256GCMKey}

