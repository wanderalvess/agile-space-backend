services:
  db:
    image: postgres:17-alpine
    container_name: agile-space-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: espacoagil
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - agile-space-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d espacoagil"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: agile-space-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/espacoagil
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    ports:
      - "8002:8002"

  frontend:
    build: ../agile-space-frontend
    container_name: agile-space-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "9002:9002"

volumes:
  agile-space-db-data:
